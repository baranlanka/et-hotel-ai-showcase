# Promtail — tails the app/worker structured JSON logs and ships them to Loki,
# promoting a few high-cardinality-safe fields (level, service_name, trace_id)
# to labels so logs can be pivoted to traces in Grafana.
server:
  http_listen_port: 9080
clients:
  - url: http://loki:3100/loki/api/v1/push
positions:
  filename: /tmp/positions.yaml
scrape_configs:
  - job_name: app-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: app
          __path__: /var/log/app/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            service_name: service_name
            trace_id: trace_id
            span_id: span_id
            message: message
            traceback: traceback
      - labels:
          level:
          service_name:
          trace_id:
          span_id:
      - timestamp:
          source: timestamp
          format: "2006-01-02 15:04:05,000" # adjust to your log timestamp format
          # For ISO8601 timestamps use format: RFC3339Nano
