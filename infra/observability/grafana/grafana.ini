# Grafana — showcase profile. Admin credentials and the session secret are NOT
# stored here; they are injected as GF_SECURITY_* environment variables by
# docker-compose.yml (see the env-placeholder values there). Anonymous access is
# enabled so the dashboards are viewable without a login.
[server]
http_port = 3000
domain = localhost
root_url = http://localhost:3000

[security]
disable_gravatar = true
cookie_secure = false
cookie_samesite = lax

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_role = Admin
default_theme = dark

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Admin
hide_version = false

[feature_toggles]
enable = traceqlEditor,tempoServiceGraph,tempoApmTable

[log]
mode = console
level = info

[dashboards]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/definitions/home.json

[explore]
enabled = true

[help]
enabled = true

[query_history]
enabled = true

[unified_alerting]
enabled = true
